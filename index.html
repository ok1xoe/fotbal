<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Fotbálek</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="screen" width="256" height="192"></canvas>

    <div id="touch" aria-label="Dotykové ovládání">
        <div class="pad">
            <button data-act="up" class="u" aria-label="Nahoru">▲</button>
            <button data-act="left" class="l" aria-label="Vlevo">◀</button>
            <button data-act="right" class="r" aria-label="Vpravo">▶</button>
            <button data-act="down" class="d" aria-label="Dolů">▼</button>
        </div>
        <div class="acts">
            <button data-act="pause" class="small" aria-label="Pauza">❚❚</button>
            <button data-act="slide" class="slide" aria-label="Skluz">SKLUZ</button>
            <button data-act="kick" class="kick" aria-label="Kop">KOP</button>
        </div>
    </div>

    <script src="js/font.js"></script>
    <script src="js/gfx.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/pens.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
